"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    "Check if email is available for registration"
    checkEmailAvailability(email: String! @rules(apply: ["required", "email"])): Boolean! @field(resolver: "App\\GraphQL\\Queries\\CheckEmailAvailability")
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address (privacy controlled)."
    email: String @field(resolver: "App\\GraphQL\\Types\\UserType@email")

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}

"Product model base type"
type Product {
    "Unique primary key."
    id: ID!

    "Product name in English."
    name_en: String!

    "Product name in Arabic."
    name_ar: String!

    "Product price."
    price: Float!

    "Product slug for URL generation."
    slug: String!

    "Whether the product is active."
    is_active: Boolean!

    "When the product was created."
    created_at: DateTime!

    "When the product was last updated."
    updated_at: DateTime!

    "Product category."
    category: Category! @belongsTo

    "Product brand."
    brand: Brand! @belongsTo
}

"Category model base type"
type Category {
    "Unique primary key."
    id: ID!

    "Category name in English."
    name_en: String!

    "Category name in Arabic."
    name_ar: String!

    "Category image."
    image: String

    "When the category was created."
    created_at: DateTime!

    "When the category was last updated."
    updated_at: DateTime!
}

"Brand model base type"
type Brand {
    "Unique primary key."
    id: ID!

    "Brand name in English."
    name_en: String!

    "Brand name in Arabic."
    name_ar: String!

    "Brand image."
    image: String

    "When the brand was created."
    created_at: DateTime!

    "When the brand was last updated."
    updated_at: DateTime!
}
