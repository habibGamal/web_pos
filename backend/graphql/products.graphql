# Product Catalog Types and Queries
# This file contains all product catalog-related GraphQL types, inputs, and queries

# Product type
type Product {
    "Unique primary key."
    id: ID!

    "Product SKU (for variants and simple products)"
    sku: String

    "Product price."
    price: Float!

    "Product slug for URL generation."
    slug: String!

    "Whether the product is active."
    is_active: Boolean!

    "When the product was created."
    created_at: DateTime!

    "When the product was last updated."
    updated_at: DateTime!

    "Product category."
    category: Category! @belongsTo

    "Product brand."
    brand: Brand! @belongsTo

    "Product's name in current locale"
    name: String! @localized

    "Product's description in current locale"
    description: String @localized

    "Product's sale price (if on sale)"
    sale_price: Float

    "Whether the product is featured"
    is_featured: Boolean!

    "Whether the product is in stock"
    is_in_stock: Boolean!

    "Product's featured image URL"
    featured_image: String

    "Product's image gallery URLs"
    images: [String!]!

    "Product's effective price (considers sale price)"
    effective_price: Float! @field(resolver: "App\\GraphQL\\Types\\ProductType@effectivePrice")

    "Product's discount percentage (if on sale)"
    discount_percentage: Float @field(resolver: "App\\GraphQL\\Types\\ProductType@discountPercentage")

    "Whether the product is on sale"
    is_on_sale: Boolean! @field(resolver: "App\\GraphQL\\Types\\ProductType@isOnSale")

    "Whether the user has this product in wishlist"
    is_in_wishlist: Boolean @field(resolver: "App\\GraphQL\\Types\\ProductType@isInWishlist")

    "Product's total stock across all variants"
    stock: Int!

    "Product's variants"
    variants: [ProductVariant!]! @hasMany

    "Product's default variant"
    default_variant: ProductVariant @method(name: "defaultVariant")

    "Product's sections"
    sections: [Section!]! @belongsToMany

    "Product's options"
    options: [Option!]! @belongsToMany
}

# Product Variant type (now same as Product with type = VARIANT)
type ProductVariant {
    "Unique identifier"
    id: ID!

    "Parent product ID this variant belongs to"
    parent_id: ID!

    "Variant display name based on attributes"
    name: String! @rename(attribute: "attributes_string")

    "Variant SKU"
    sku: String!

    "Variant images array"
    images: [String!]!

    "Variant stock quantity"
    quantity: Int!

    "Variant price (nullable - uses parent product price if not set)"
    price: Float

    "Variant sale price (nullable)"
    sale_price: Float

    "Variant attributes as formatted string"
    attributes_string: String

    "Whether this is the default variant"
    is_default: Boolean!

    "Whether the variant is active"
    is_active: Boolean!

    "Variant's effective price (with fallback to parent)"
    effective_price: Float! @field(resolver: "App\\GraphQL\\Types\\ProductVariantType@effectivePrice")

    "When the variant was created"
    created_at: DateTime!

    "When the variant was last updated"
    updated_at: DateTime!

    "Parent product"
    parent: Product! @belongsTo(relation: "parent")

    "Variant's attribute values"
    attribute_values: [AttributeValue!]! @belongsToMany(relation: "attributeValues")

    "Variant's attributes grouped by attribute type"
    grouped_attributes: [GroupedAttribute!]! @field(resolver: "App\\GraphQL\\Types\\ProductVariantType@groupedAttributes")

    "Whether the variant is in stock"
    is_in_stock: Boolean! @field(resolver: "App\\GraphQL\\Types\\ProductVariantType@isInStock")

    "Variant's featured image URL"
    featured_image: String
}

# Category type
type Category {
    "Unique primary key."
    id: ID!

    "Category slug for URL generation"
    slug: String!

    "Category name in current locale"
    name: String! @localized

    "Category name in English"
    name_en: String!

    "Category name in Arabic"
    name_ar: String!

    "Category's display image with fallback logic"
    image: String

    "Category's display image URL (alias)"
    display_image: String @rename(attribute: "image")

    "Category's image URL (alias)"
    image_url: String @rename(attribute: "image")

    "Category's display order"
    display_order: Int!

    "Category's URL (for frontend routing)"
    url: String @method(name: "url")

    "Category's parent ID"
    parent_id: ID

    "Whether the category is active"
    is_active: Boolean!

    "Number of products in this category"
    products_count: Int! @count(relation: "products")

    "Number of active products in this category"
    active_products_count: Int! @count(relation: "products", scopes: ["active"])

    "Whether the category has any products"
    has_products: Boolean! @method(name: "hasProducts")

    "Category's parent category"
    parent: Category @belongsTo(relation: "parent")

    "Category's child categories"
    children: [Category!]! @hasMany(relation: "children")

    "Category's products"
    products: [Product!]! @hasMany

    "When the category was created."
    created_at: DateTime!

    "When the category was last updated."
    updated_at: DateTime!
}

# Brand type
type Brand {
    "Unique primary key."
    id: ID!

    "When the brand was created."
    created_at: DateTime!

    "When the brand was last updated."
    updated_at: DateTime!

    "Brand slug for URL generation"
    slug: String!

    "Brand name in current locale"
    name: String! @localized

    "Brand name in English"
    name_en: String!

    "Brand name in Arabic"
    name_ar: String!

    "Brand's display image with fallback logic"
    image: String

    "Brand's display image URL (alias)"
    display_image: String @rename(attribute: "image")

    "Brand's image URL (alias)"
    image_url: String @rename(attribute: "image")

    "Brand's display order"
    display_order: Int!

    "Brand's URL (for frontend routing)"
    url: String @method(name: "url")

    "Brand's parent ID"
    parent_id: ID

    "Whether the brand is active"
    is_active: Boolean!

    "Number of products for this brand"
    products_count: Int! @count(relation: "products")

    "Number of active products for this brand"
    active_products_count: Int! @count(relation: "products", scopes: ["active"])

    "Whether the brand has any products"
    has_products: Boolean! @method(name: "hasProducts")

    "Brand's parent brand"
    parent: Brand @belongsTo(relation: "parent")

    "Brand's child brands"
    children: [Brand!]! @hasMany(relation: "children")

    "Brand's products"
    products: [Product!]! @hasMany
}

# Section type
type Section {
    "Unique identifier"
    id: ID!

    "Section title in current locale"
    title: String! @localized

    "Whether the section is active"
    active: Boolean!

    "Section's sort order"
    sort_order: Int!

    "Section type (REAL, RECOMMENDATION, etc.)"
    section_type: SectionType!

    "When the section was created"
    created_at: DateTime!

    "When the section was last updated"
    updated_at: DateTime!

    "Section's products"
    products: [Product!]! @belongsToMany

    "Number of products in this section"
    products_count: Int! @count(relation: "products")

    "Number of active products in this section"
    active_products_count: Int! @count(relation: "products", scopes: ["active"])

    "Whether the section has any products"
    has_products: Boolean! @method(name: "hasProducts")
}

# Attribute type
type Attribute {
    "Unique identifier"
    id: ID!

    "Attribute name in current locale"
    name: String! @localized

    "Attribute name in English"
    name_en: String!

    "Attribute name in Arabic"
    name_ar: String!

    "Attribute input type"
    type: AttributeInputType!

    "Attribute description in current locale"
    description: String @localized

    "Attribute description in English"
    description_en: String

    "Attribute description in Arabic"
    description_ar: String

    "Sort order"
    sort_order: Int!

    "When the attribute was created"
    created_at: DateTime!

    "When the attribute was last updated"
    updated_at: DateTime!

    "Attribute values"
    values: [AttributeValue!]! @hasMany
}

# Attribute Value type
type AttributeValue {
    "Unique identifier"
    id: ID!

    "Attribute ID this value belongs to"
    attribute_id: ID!

    "Value identifier (raw value like 'S', 'M', 'L')"
    value: String!

    "Value identifier in English"
    value_en: String

    "Value identifier in Arabic"
    value_ar: String

    "Display value (localized) - for frontend display"
    display_value: String! @localized(field: "value")

    "Color code for color attributes"
    color_code: String

    "Sort order"
    sort_order: Int!

    "When the value was created"
    created_at: DateTime!

    "When the value was last updated"
    updated_at: DateTime!

    "Parent attribute"
    attribute: Attribute! @belongsTo

    "Product variants using this value"
    variants: [Product!]! @belongsToMany(relation: "variants")
}

# Option type
type Option {
    "Unique identifier"
    id: ID!

    "Option name (localized)"
    name: String! @localized

    "Option name in English"
    name_en: String!

    "Option name in Arabic"
    name_ar: String!

    "Array of possible values"
    values: [String!]!

    "When the option was created"
    created_at: DateTime!

    "When the option was last updated"
    updated_at: DateTime!
}

# Variant Attribute Group type
type VariantAttributeGroup {
    "Attribute information"
    attribute: Attribute!

    "Values for this attribute (localized display values)"
    values: [String!]!
}

# Grouped attributes result
type GroupedAttribute {
    "Attribute information"
    attribute: Attribute!

    "Values for this attribute (localized display values)"
    values: [String!]!
}

# Enums
enum AttributeInputType {
    "Select dropdown"
    SELECT @enum(value: "select")

    "Text input"
    TEXT @enum(value: "text")

    "Number input"
    NUMBER @enum(value: "number")

    "Boolean checkbox"
    BOOLEAN @enum(value: "boolean")

    "Color picker"
    COLOR @enum(value: "color")
}

enum SectionType {
    "Real section with manually selected products"
    REAL @enum(value: "REAL")

    "Recommendation section with algorithmic products"
    RECOMMENDATION @enum(value: "RECOMMENDATION")

    "Trending products section"
    TRENDING @enum(value: "TRENDING")

    "New arrivals section"
    NEW_ARRIVALS @enum(value: "NEW_ARRIVALS")
}

# Input Types for Queries
input ProductSearchInput {
    "Search query string"
    query: String

    "Filter by category ID"
    category_id: ID

    "Filter by brand ID"
    brand_id: ID

    "Minimum price filter"
    min_price: Float

    "Maximum price filter"
    max_price: Float

    "Filter by featured products only"
    is_featured: Boolean

    "Filter by products on sale only"
    is_on_sale: Boolean

    "Filter by in stock products only"
    in_stock_only: Boolean
}

input ProductOrderByClause {
    "Field to order by"
    column: ProductOrderByColumn!

    "Sort order direction"
    order: SortOrder!
}

enum ProductOrderByColumn {
    ID @enum(value: "id")
    NAME_EN @enum(value: "name_en")
    NAME_AR @enum(value: "name_ar")
    PRICE @enum(value: "price")
    SALE_PRICE @enum(value: "sale_price")
    CREATED_AT @enum(value: "created_at")
    UPDATED_AT @enum(value: "updated_at")
    IS_FEATURED @enum(value: "is_featured")
}

enum SortOrder {
    ASC @enum(value: "asc")
    DESC @enum(value: "desc")
}



# Product Catalog Queries
extend type Query {
    "Get all products with filtering and pagination"
    products(
        "Search and filter options"
        search: ProductSearchInput
        "Sort order"
        orderBy: [ProductOrderByClause!]
    ): [Product!]! @paginate(defaultCount: 12, builder: "App\\GraphQL\\Queries\\ProductsQuery")

    "Get a single product by ID"
    product(
        "Product ID"
        id: ID! @rules(apply: ["required", "exists:products,id"])
    ): Product @first

    "Get a single product by slug"
    productBySlug(
        "Product slug"
        slug: String! @rules(apply: ["required", "exists:products,slug"]) @where(key: "slug")
    ): Product @first(scopes: ["active"])

    "Get all categories in hierarchical structure"
    categories(
        "Filter by active status"
        is_active: Boolean = true
        "Include parent categories only"
        parents_only: Boolean = false
    ): [Category!]! @field(resolver: "App\\GraphQL\\Queries\\CategoriesQuery")

    "Get a single category by ID"
    category(
        "Category ID"
        id: ID! @rules(apply: ["required", "exists:categories,id"])
    ): Category @first

    "Get a single category by slug"
    categoryBySlug(
        "Category slug"
        slug: String! @rules(apply: ["required", "exists:categories,slug"]) @where(key: "slug")
    ): Category @first

    "Get all brands in hierarchical structure"
    brands(
        "Filter by active status"
        is_active: Boolean = true
        "Include parent brands only"
        parents_only: Boolean = false
    ): [Brand!]! @field(resolver: "App\\GraphQL\\Queries\\BrandsQuery")

    "Get a single brand by ID"
    brand(
        "Brand ID"
        id: ID! @rules(apply: ["required", "exists:brands,id"])
    ): Brand @first

    "Get a single brand by slug"
    brandBySlug(
        "Brand slug"
        slug: String! @rules(apply: ["required", "exists:brands,slug"]) @where(key: "slug")
    ): Brand @first

    "Get all sections"
    sections(
        "Filter by active status"
        active: Boolean = true @where
    ): [Section!]! @all @orderBy(column: "sort_order")

    "Get a single section by ID"
    section(
        "Section ID"
        id: ID! @rules(apply: ["required", "exists:sections,id"])
    ): Section @first

    "Search products with text-based search"
    searchProducts(
        "Search query"
        query: String! @rules(apply: ["required", "min:2"])
        "Additional filters"
        filters: ProductSearchInput
        "Sort order"
        orderBy: [ProductOrderByClause!]
    ): [Product!]! @paginate(defaultCount: 12, builder: "App\\GraphQL\\Queries\\SearchQuery")

    "Get search suggestions based on query"
    searchSuggestions(
        "Search query"
        query: String! @rules(apply: ["required", "min:1"])
        "Maximum number of suggestions"
        limit: Int = 10
    ): [String!]! @field(resolver: "App\\GraphQL\\Queries\\SearchQuery@suggestions")

    "Get all attributes"
    attributes: [Attribute!]! @all @orderBy(column: "sort_order")

    "Get a single attribute by ID"
    attribute(
        "Attribute ID"
        id: ID! @rules(apply: ["required", "exists:attributes,id"])
    ): Attribute @first

    "Get all attribute values"
    attributeValues(
        "Filter by attribute ID"
        attribute_id: ID @where
    ): [AttributeValue!]! @all @orderBy(column: "sort_order")

    "Get a single attribute value by ID"
    attributeValue(
        "Attribute Value ID"
        id: ID! @rules(apply: ["required", "exists:attribute_values,id"])
    ): AttributeValue @first
}

# Using String scalar for variant attributes and other JSON data (stored as JSON strings)
