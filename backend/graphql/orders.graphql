# Order Management Types and Mutations
# This file contains all order-related GraphQL types, inputs, and mutations

# Order type
type Order {
    "Unique identifier"
    id: ID!

    "User ID this order belongs to"
    user_id: ID!

    "Order status"
    order_status: OrderStatus!

    "Payment status"
    payment_status: PaymentStatus!

    "Subtotal before taxes and discounts"
    subtotal: Float!

    "Shipping cost"
    shipping_cost: Float!

    "Discount amount"
    discount: Float!

    "Total order amount"
    total: Float!

    "Currency code"
    currency: String! @method(name: "getCurrency")

    "Shipping address"
    shipping_address: Address! @belongsTo(relation: "shippingAddress")

    "Order notes"
    notes: String

    "When the order was placed"
    created_at: DateTime!

    "When the order was last updated"
    updated_at: DateTime!

    "Order owner"
    user: User! @belongsTo

    "Order items"
    items: [OrderItem!]! @hasMany

    "Returns for this order"
    returns: [ReturnOrder!]! @hasMany(relation: "returnOrders")

    "Whether the order can be cancelled"
    can_be_cancelled: Boolean! @method(name: "canBeCancelled")

    "Whether the order can be returned"
    can_be_returned: Boolean! @method(name: "canBeReturned")

    "Order tracking information"
    tracking_number: String

    "Estimated delivery date"
    estimated_delivery_date: DateTime

    "Actual delivery date"
    delivered_at: DateTime
}

# Order Item type
type OrderItem {
    "Unique identifier"
    id: ID!

    "Order ID this item belongs to"
    order_id: ID!

    "Product ID"
    product_id: ID!

    "Quantity ordered"
    quantity: Int!

    "Unit price at time of order"
    unit_price: Float!

    "Total price for this line item"
    subtotal: Float!

    "Selected product options at time of order (e.g., {Color: Red, Size: Large})"
    options: String

    "Product this order item belongs to (can be a variant)"
    product: Product! @belongsTo(foreignKey: "product_id")

    "When the item was added to order"
    created_at: DateTime!

    "When the item was last updated"
    updated_at: DateTime!

    "Order this item belongs to"
    order: Order! @belongsTo

    "Return items for this order item"
    returnItems: [ReturnItem!]! @hasMany

    "Quantity that can still be returned"
    returnable_quantity: Int! @field(resolver: "App\\GraphQL\\Types\\OrderItemType@returnableQuantity")
}

# Return Order type
type ReturnOrder {
    "Unique identifier"
    id: ID!

    "Return number (user-facing)"
    return_number: String!

    "Original order ID"
    order_id: ID!

    "Return status"
    status: ReturnStatus!

    "Return reason"
    reason: ReturnReason!

    "Additional return notes"
    notes: String

    "Refund amount"
    refund_amount: Float!

    "When the return was requested"
    created_at: DateTime!

    "When the return was last updated"
    updated_at: DateTime!

    "When the return was approved"
    approved_at: DateTime

    "When the refund was processed"
    refunded_at: DateTime

    "Original order"
    order: Order! @belongsTo

    "Return items"
    returnItems: [ReturnItem!]! @hasMany

    "Return status history"
    statusHistory: [ReturnStatusHistory!]! @hasMany
}

# Return Item type
type ReturnItem {
    "Unique identifier"
    id: ID!

    "Return order ID"
    return_order_id: ID!

    "Original order item ID"
    order_item_id: ID!

    "Quantity being returned"
    quantity: Int!

    "Unit price at time of return"
    unit_price: Float!

    "Total price for this return item"
    subtotal: Float!

    "When the item was added to return"
    created_at: DateTime!

    "Return order this item belongs to"
    returnOrder: ReturnOrder! @belongsTo

    "Original order item"
    orderItem: OrderItem! @belongsTo
}

# Return Status History type
type ReturnStatusHistory {
    "Unique identifier"
    id: ID!

    "Return order ID"
    return_order_id: ID!

    "Previous status"
    previous_status: ReturnStatus

    "New status"
    new_status: ReturnStatus!

    "Status change notes"
    notes: String

    "User who made the change"
    changed_by_user_id: ID

    "When the status was changed"
    created_at: DateTime!

    "Return order this history belongs to"
    returnOrder: ReturnOrder! @belongsTo

    "User who made the change"
    changedBy: User @belongsTo(relation: "changedBy")
}

# Enums
enum OrderStatus {
    "Order placed but not yet confirmed"
    PENDING @enum(value: "PENDING")

    "Order confirmed and being prepared"
    CONFIRMED @enum(value: "CONFIRMED")

    "Order is being processed"
    PROCESSING @enum(value: "PROCESSING")

    "Order has been shipped"
    SHIPPED @enum(value: "SHIPPED")

    "Order has been delivered"
    DELIVERED @enum(value: "DELIVERED")

    "Order has been cancelled"
    CANCELLED @enum(value: "CANCELLED")

    "Order has been refunded"
    REFUNDED @enum(value: "REFUNDED")
}

enum PaymentStatus {
    "Payment is pending"
    PENDING @enum(value: "PENDING")

    "Payment was successful"
    PAID @enum(value: "PAID")

    "Payment failed"
    FAILED @enum(value: "FAILED")

    "Payment was cancelled"
    CANCELLED @enum(value: "CANCELLED")

    "Payment was refunded"
    REFUNDED @enum(value: "REFUNDED")

    "Partial refund processed"
    PARTIALLY_REFUNDED @enum(value: "PARTIALLY_REFUNDED")
}

enum PaymentMethod {
    "Cash on Delivery / الدفع عند الاستلام"
    CASH_ON_DELIVERY @enum(value: "cash_on_delivery")

    "Credit Card / بطاقة ائتمانية"
    CREDIT_CARD @enum(value: "credit_card")

    "Wallet / المحفظة الإلكترونية"
    WALLET @enum(value: "wallet")
}

enum ReturnStatus {
    "Return requested by customer"
    REQUESTED @enum(value: "REQUESTED")

    "Return approved by admin"
    APPROVED @enum(value: "APPROVED")

    "Return rejected by admin"
    REJECTED @enum(value: "REJECTED")

    "Items received for return"
    RECEIVED @enum(value: "RECEIVED")

    "Return processed and refund issued"
    REFUNDED @enum(value: "REFUNDED")

    "Return cancelled"
    CANCELLED @enum(value: "CANCELLED")
}

enum ReturnReason {
    "Product was defective"
    DEFECTIVE @enum(value: "DEFECTIVE")

    "Wrong item received"
    WRONG_ITEM @enum(value: "WRONG_ITEM")

    "Item damaged during shipping"
    DAMAGED @enum(value: "DAMAGED")

    "Item not as described"
    NOT_AS_DESCRIBED @enum(value: "NOT_AS_DESCRIBED")

    "Changed mind"
    CHANGED_MIND @enum(value: "CHANGED_MIND")

    "Size/fit issues"
    SIZE_FIT @enum(value: "SIZE_FIT")

    "Other reason"
    OTHER @enum(value: "OTHER")
}

# Input types
input CreateOrderInput {
    "Shipping address"
    shipping_address_id: Int! @rules(apply: ["required", "exists:addresses,id"])

    "Payment method"
    payment_method: PaymentMethod!

    "Order notes"
    notes: String
}

input CancelOrderInput {
    "Order ID to cancel"
    order_id: ID! @rules(apply: ["required", "exists:orders,id"])

    "Cancellation reason"
    reason: String @rules(apply: ["nullable", "string", "max:500"])
}

input CreateReturnInput {
    "Order ID to return items from"
    order_id: ID! @rules(apply: ["required", "exists:orders,id"])

    "Return reason"
    reason: ReturnReason! @rules(apply: ["required"])

    "Items to return"
    items: [ReturnItemInput!]! @rules(apply: ["required", "array", "min:1"])
}

input ReturnItemInput {
    "Order item ID"
    order_item_id: ID! @rules(apply: ["required", "exists:order_items,id"])

    "Quantity to return"
    quantity: Int! @rules(apply: ["required", "min:1"])
}

# Order and Return Queries
extend type Query {

    "Get user's orders with pagination"
    orders(
        "Filter by status"
        status: OrderStatus
        "Date range filter"
        date_from: DateTime
        "Date range filter"
        date_to: DateTime
    ): [Order!]! @paginate(defaultCount: 10, builder: "App\\GraphQL\\Queries\\OrdersQuery") @guard

    "Get single order by ID"
    order(
        "Order ID"
        id: ID! @rules(apply: ["required", "exists:orders,id"])
    ): Order @field(resolver: "App\\GraphQL\\Queries\\OrdersQuery@order") @guard

    "Get user's returns with pagination"
    returns(
        "Filter by status"
        status: ReturnStatus
    ): [ReturnOrder!]! @paginate(defaultCount: 10, builder: "App\\GraphQL\\Queries\\ReturnsQuery") @guard

    "Get single return by ID"
    returnOrder(
        "Return ID"
        id: ID! @rules(apply: ["required", "exists:return_orders,id"])
    ): ReturnOrder @field(resolver: "App\\GraphQL\\Queries\\ReturnsQuery@returnOrder") @guard
}

# Order and Return Mutations
extend type Mutation {
    "Create new order from cart"
    createOrder(input: CreateOrderInput! @spread): Order! @field(resolver: "App\\GraphQL\\Mutations\\Orders\\CreateOrderMutation") @guard

    "Cancel an order"
    cancelOrder(input: CancelOrderInput! @spread): Order! @field(resolver: "App\\GraphQL\\Mutations\\Orders\\CancelOrderMutation") @guard

    "Create return request"
    createReturn(input: CreateReturnInput! @spread): ReturnOrder! @field(resolver: "App\\GraphQL\\Mutations\\Returns\\CreateReturnMutation") @guard

    "Cancel return request"
    cancelReturn(
        "Return ID to cancel"
        return_id: ID! @rules(apply: ["required", "exists:return_orders,id"])
    ): ReturnOrder! @field(resolver: "App\\GraphQL\\Mutations\\Returns\\CancelReturnMutation") @guard
}
